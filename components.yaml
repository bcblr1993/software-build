# SprixinSoft 离线安装包组件清单
#
# 这是整套构建系统的唯一事实来源。
# 升级任何组件，只需修改这里的 version 与 sha256，然后触发构建。
#
# 兼容性策略：
#   所有需编译的组件均在 glibc 2.17 (CentOS 7) 基线上构建，并把
#   OpenSSL / PCRE2 / zlib 随包分发，通过 $ORIGIN 相对 rpath 加载。
#   由此产出的二进制不依赖目标系统的发行版、小版本或补丁号，
#   可运行于任何 glibc >= 2.17 的 Linux。
#   该结论由 abi-gate 在每次构建后以 readelf 断言强制校验。

package:
  name: sprixinSoft
  version: v14
  # 安装后的顶层目录名。不要修改：现场安装目录结构依赖它。
  top_dir: sprixinSoft

baseline:
  # 目标系统实测 glibc：CentOS 7 = 2.17，凝思 6.0.99 = 2.28，
  # 凝思 6.0.99 EL22.03 = 2.34，麒麟 V10 SP2 = 2.28。取最低者为基线。
  glibc_max: "2.17"
  images:
    x86_64: sprixin-baseline:centos7-x86_64
    aarch64: sprixin-baseline:centos7-aarch64

architectures:
  - x86_64
  - aarch64

# 随包分发的运行库。目标系统各自带的 OpenSSL 小版本互不相同
# (凝思 SP3 = 1.1.1m, 凝思 EL22.03 = 1.1.1wa, 麒麟 V10 = 1.1.1f)，
# 自带后彻底摆脱该差异，且 OpenSSL 被安全扫描点名时可自主升级。
vendored_libs:
  openssl:
    version: "1.1.1w"
    url: https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
    sha256: cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8
    configure:
      - no-shared-default
      - shared
      - no-tests
  pcre2:
    version: "10.44"
    url: https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
    sha256: 86b9cb0aa3bcb7994faa88018292bc704cdbb708e785f7c74352ff6ea7d3175b
  zlib:
    version: "1.3.1"
    url: https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
    sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23

components:

  nginx:
    build: compile
    version: "1.31.3"
    url: https://nginx.org/download/nginx-{version}.tar.gz
    sha256: a7657c50811c2d92d9895395e8b873ef60398142c4db21eb647811c38f6dd525
    # 保持与现有包一致，勿改：现场 nginx.conf 与启停脚本依赖该前缀
    configure:
      - --prefix=/home/sprixin/nginx
      - --with-http_ssl_module
      - --with-http_v2_module
    vendor: [openssl, pcre2, zlib]
    # 安装后二进制位置，供 abi-gate 与 verify 定位
    # 真二进制为 nginx.bin；同名的 sbin/nginx 是包装脚本，
    # 负责按实际安装路径补上 -p/-c/-e，详见配方中的说明。
    artifacts: [sbin/nginx.bin]

  redis:
    build: compile
    # 注意：现有 x86 包为 8.2.6、ARM 包为 8.2.3，版本漂移。此处统一。
    # 归档地址与校验凭据见 upstreams.redis —— 升级只改这一行版本号。
    version: "8.8.0"
    vendor: [openssl]
    artifacts:
      - bin/redis-server
      - bin/redis-cli
      - bin/redis-sentinel
      - bin/redis-check-aof
      - bin/redis-check-rdb
      - bin/redis-benchmark

  keepalived:
    build: compile
    version: "2.3.4"
    url: https://www.keepalived.org/software/keepalived-{version}.tar.gz
    sha256: 6afd95ddb7d3e0d3b8b8e5b3a489144131b61a01b06d29e883d0c44acc8a36bf
    # 保持与现有包一致。--disable-lvs 等参数把内核依赖面压到最小，
    # 只剩 VRRP 的 netlink + socket，属最稳定的内核 ABI。
    configure:
      - --disable-lvs
      - --disable-nftables
      - --disable-iptables
      - --disable-dbus
      - --disable-snmp
      - --disable-systemd
      - --disable-track-process
      - --enable-json
      - --enable-log-file
    # CentOS 7 基线内核头(3.10)缺这两个 setsockopt 选项号。
    # 它们是固定不变的内核 ABI 常量，编译期定义即可，运行时内核支持就生效。
    cppflags:
      - -DIPV6_TRANSPARENT=75
      - -DIPV6_FREEBIND=78
    # 现有 x86 包链接了 libcrypto.so.1.0.0，而目标系统只提供 1.1.1，
    # 且 ISO 未提供 compat-openssl10 —— 自带 OpenSSL 后该缺陷消失。
    vendor: [openssl]
    artifacts: [sbin/keepalived]

  rabbitmq:
    # 官方 generic-unix 包自带 Erlang/OTP，只需对自带 OpenSSL 重建 crypto NIF
    build: relink-nif
    version: "4.2.7"
    url: https://github.com/rabbitmq/rabbitmq-server/releases/download/v{version}/rabbitmq-server-generic-unix-{version}.tar.xz
    sha256: 35a1b1699d8369e0c63d31676978ffa98d171855e21d662170ae91dcfc3557b1
    otp_tag: OTP-26.2.5.18
    nifs:
      - crypto.so
      - crypto_callback.so
      - otp_test_engine.so
    vendor: [openssl]

  # 以下组件为 Java / Go 产物，本身不链接系统库，跨发行版通用，
  # 升级时直接替换上游归档即可，无需编译。
  nacos:
    build: repack
    # 纯 Java，产物不含原生代码，两个架构用的是同一份东西。
    # 故某一架构上传的归档对另一架构同样适用 —— 否则只传了 x86 那份时，
    # ARM 会退回上游原版，同一个版本的两个包里装着不同的 nacos。
    # 注意 influxdb 与 jdk 不可比照办理：它们是各自架构的原生二进制。
    arch_independent: true
    version: "2.2.3"
    url: https://github.com/alibaba/nacos/releases/download/{version}/nacos-server-{version}.tar.gz
    sha256: LOCK

  influxdb:
    build: repack
    version: "1.7.8"
    url_per_arch:
      x86_64: https://dl.influxdata.com/influxdb/releases/influxdb-{version}_linux_amd64.tar.gz
      aarch64: https://dl.influxdata.com/influxdb/releases/influxdb-{version}_linux_arm64.tar.gz
    sha256: LOCK

  jdk:
    build: repack
    # JDK 为二进制发行版，x86 与 ARM 版本号不同源，分别指定
    version_per_arch:
      x86_64: "8u181"
      aarch64: "8u351"
    local_only: true
    note: 上游需授权下载，从 cache/ 提供本地归档

# 基准包中存在但不再随包发布的组件。
# 打包时跳过，相关的启停、自检与日志逻辑也一并移除。
excluded_components:
  # 现场未使用，移除以缩减包体积与攻击面
  - chronograf

# 上游登记：把「版本号 → 官方归档 + 可信校验凭据」的对应关系集中在此。
#
# 登记过的组件，升级时只需改上面的 version，归档由系统自动取回，期望
# 哈希来自上游签名或上游哈希清单 —— 不必再人工抄 sha256。此前 redis
# 从 8.2.6 改到 8.8.0 时哈希忘了跟着改，构建就是这么失败的。
#
# verify.method 的三级可信度（详见 scripts/sprixin_build/upstream.py）：
#   pgp          上游私钥签名，用固化在 keys/ 的公钥验签，并断言签名者
#                指纹在 fingerprints 白名单内 —— 只看 gpg 退出码是不够的，
#                任何人都能自签一个归档。
#   hash-index   上游在另一处发布的哈希清单，攻击者需同时控制两个站点。
#   cross-source 从彼此独立的镜像各取一份比对，用于既不签名也不发哈希的项目。
upstreams:
  nginx:
    tarball: https://nginx.org/download/nginx-{version}.tar.gz
    verify:
      method: pgp
      signature: "{tarball}.asc"
      keyring: keys/nginx.asc
      # nginx 由多位核心开发者轮流签发，任一在列即可
      fingerprints:
        - 43387825DDB1BB97EC36BA5D007C8D7C15D87369  # Roman Arutyunyan
        - 13C82A63B603576156E30A4EA0EA981B66B0D967  # Konstantin Pavlov
        - D6786CE303D9A9022998DC6CC8464D549AF75C0A  # Sergey Kandaurov
        - 41DB92713D3BF4BFF3EE91069C5E7FA2F54977D4  # Maxim Dounin
        - 7338973069ED3F443F4D37DFA64FD5B17ADB39A8  # Sergey Budnevitch

  redis:
    # 官方发布的 tarball，与 GitHub 自动生成的 archive 并非同一个文件，
    # 两者哈希不同。此处取官方发布版，其哈希才与官方哈希清单对得上。
    tarball: https://download.redis.io/releases/redis-{version}.tar.gz
    verify:
      method: hash-index
      index: https://raw.githubusercontent.com/redis/redis-hashes/master/README
      pattern: '^hash\s+redis-{version}\.tar\.gz\s+sha256\s+([0-9a-f]{64})'

  rabbitmq:
    tarball: https://github.com/rabbitmq/rabbitmq-server/releases/download/v{version}/rabbitmq-server-generic-unix-{version}.tar.xz
    verify:
      method: pgp
      signature: "{tarball}.asc"
      keyring: keys/rabbitmq.asc
      fingerprints:
        - 0A9AF2115F4687BD29803A206B73A36E6026DFCA  # RabbitMQ Release Signing Key

  keepalived:
    # keepalived 上游既不签名也不发布哈希清单 —— 这是上游自身的缺口，
    # 无法凭空补上。退而求其次：与 Debian 归档中的同名上游 tarball 比对。
    # 两者实测字节一致（sha256 6afd95dd…），且 Fedora 记录的 SHA512 亦吻合，
    # 攻击者需同时改掉 keepalived.org 与 Debian 归档才能蒙混过关。
    #
    # 若 Debian 尚未收录目标版本，交叉比对无从进行，构建会被拒绝并提示 ——
    # 这是刻意的：宁可挡住，也不在无凭据的情况下放行。
    tarball: https://www.keepalived.org/software/keepalived-{version}.tar.gz
    verify:
      method: cross-source
      mirrors:
        - http://deb.debian.org/debian/pool/main/k/keepalived/keepalived_{version}.orig.tar.gz

# 安装包内的静态文件，来自 overlay/，打包时原样复制。
# install.sh / startup.sh / shutdown.sh 的行为必须与现有包保持一致。
overlay_files:
  - install.sh
  - startup.sh
  - shutdown.sh
  - verify.sh
  - logs.sh
  - KEEPALIVED-USAGE.md
  - FAQ.md
